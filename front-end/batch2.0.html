    <script>
        window.username = null;

        async function checkAuth() {
            const token = getAuthToken();
            const payload = decodeJwtToken(token);

            const authStatus = document.getElementById('auth-status');
            const loginButton = document.getElementById('login-button');
            const logoutButton = document.getElementById('logout-button');
            const settingsButton = document.getElementById('settings-button');

            let isAuthenticated = false;

            if (token && payload) {
                // 检查是否过期 (exp是秒时间戳)
                const currentTime = Math.floor(Date.now() / 1000);
                if (payload.exp && payload.exp < currentTime) {
                    console.warn('Token已过期');
                    localStorage.removeItem('token');
                    isAuthenticated = false;
                } else {
                    isAuthenticated = true;
                }
            }

            if (isAuthenticated) {
                authStatus.textContent = '已登录用户: ' + (window.username || '用户');
                authStatus.style.color = '#52c41a';
                loginButton.style.display = 'none';
                logoutButton.style.display = 'inline-block';
                if (settingsButton) {
                    settingsButton.style.display = 'inline-block';
                }
            } else {
                authStatus.textContent = '未登录，请先登录';
                authStatus.style.color = '#ff4d4f';
                loginButton.style.display = 'inline-block';
                logoutButton.style.display = 'none';
                if (settingsButton) {
                    settingsButton.style.display = 'inline-block';
                }
            }
            
            // 重新加载设置并应用
            await applyAnimationSettings();
            return isAuthenticated;
        }

        // 从cookie中获取token
        function getCookie(name) {
            const cookieValue = document.cookie
                .split('; ') 
                .find(row => row.startsWith(name + '='))
                ?.split('=')[1];
            return cookieValue ? decodeURIComponent(cookieValue) : null;
        }

        // 删除cookie
        function deleteCookie(name) {
            document.cookie = name + '=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT;';
        }

        function getAuthToken() {
            // 首先尝试从cookie中获取token
            const token = getCookie('token');
            if (token) {
                return token;
            }
            // 如果cookie中没有，尝试从localStorage中获取
            return localStorage.getItem('token');
        }

        function login() {
            window.location.href = 'https://yutangxiaowu.top/login/login.html';
        }

        async function logout() {
            if (confirm('确定要退出登录吗?')) {
                localStorage.removeItem('token');
                // 同时清除cookie
                deleteCookie('token');
                await checkAuth();
                alert('已退出登录');
            }
        }

        // 为需要权限的请求添加Token
        async function authFetch(url, options = {}) {
            const token = getAuthToken();
            if (!token) {
                throw new Error('未登录，请先登录');
            }

            const headers = {
                ...options.headers,
                'Authorization': `Bearer ${token}`
            };

            return fetch(url, { ...options, headers });
        }

        // 解码JWT以获取用户ID
        function decodeJwtToken(token) {
            if (!token) return null;
            try {
                // JWT由3部分组成，第二部分是Payload（Base64编码）
                const payloadBase64 = token.split('.')[1];
                // Base64解码（处理URL安全编码）
                const payloadJson = decodeURIComponent(
                    atob(payloadBase64.replace(/-/g, '+').replace(/_/g, '/'))
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );
                const payload = JSON.parse(payloadJson);
                window.username = payload.username;
                return payload;
            } catch (error) {
                console.error('JWT解码失败:', error);
                return null;
            }
        }

        decodeJwtToken

        // 爱心飘落动画
        function createHeart() {
            const heart = document.createElement("span");
            heart.className = "heart";
            heart.textContent = "🩷";
            const left = Math.random() * window.innerWidth;
            heart.style.left = left + "px";
            const size = 10 + Math.random() * 20;
            heart.style.fontSize = size + "px";
            const duration = 3 + Math.random() * 5;
            heart.style.animationDuration = duration + "s";
            heart.style.transform = `rotate(${Math.random() * 360}deg)`;
            document.querySelector('.heart-fall').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }
        
        // Cookie操作函数
        function setCookie(name, value, days) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires.toUTCString()};path=/`;
        }
        
        function getCookie(name) {
            const cookieName = `${name}=`;
            const decodedCookie = decodeURIComponent(document.cookie);
            const cookieArray = decodedCookie.split(';');
            for (let i = 0; i < cookieArray.length; i++) {
                let cookie = cookieArray[i];
                while (cookie.charAt(0) === ' ') {
                    cookie = cookie.substring(1);
                }
                if (cookie.indexOf(cookieName) === 0) {
                    return cookie.substring(cookieName.length, cookie.length);
                }
            }
            return null;
        }
        
        function deleteCookie(name) {
            document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;`;
        }
        
        // 加载设置
        async function loadSettings() {
            try {
                // 首先检查是否登录
                const token = getAuthToken();
                if (token) {
                    // 从后端获取用户设置
                    const response = await authFetch('https://api.yutangxiaowu.cn/api/user/settings', {
                        method: 'GET'
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        const settings = data.settings || {};
                        // 同时保存到本地Cookie作为备份
                        setCookie('appSettings', JSON.stringify(settings), 30);
                        return settings;
                    }
                }
                // 如果未登录或获取失败，从本地Cookie获取
                const settingsCookie = getCookie('appSettings');
                return JSON.parse(settingsCookie || '{}');
            } catch (error) {
                console.error('加载设置失败:', error);
                // 出错时从本地Cookie获取
                const settingsCookie = getCookie('appSettings');
                return JSON.parse(settingsCookie || '{}');
            }
        }
        
        // 保存设置
        async function saveSettings() {
            const settings = {
                commentPages: parseInt(document.getElementById('comment-pages').value),
                maxVideos: parseInt(document.getElementById('max-videos').value),
                heartAnimation: document.getElementById('heart-animation').checked,
                heartGlobal: document.getElementById('heart-global').checked,
                heartDensity: document.getElementById('heart-density').value,
                heartSpeed: document.getElementById('heart-speed').value
            };
            
            try {
                // 首先保存到本地Cookie
                setCookie('appSettings', JSON.stringify(settings), 30);
                
                // 检查是否登录，如果登录则同步到后端
                const token = getAuthToken();
                if (token) {
                    const response = await authFetch('https://api.yutangxiaowu.cn/api/user/settings', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ settings })
                    });
                    
                    if (response.ok) {
                        showStatus('设置保存成功并同步到账号！', 'success');
                    } else {
                        showStatus('设置保存成功，但同步到账号失败', 'error');
                    }
                } else {
                    showStatus('设置保存成功！（未登录，仅保存在本地）', 'success');
                }
                
                applyAnimationSettings();
            } catch (error) {
                console.error('保存设置失败:', error);
                showStatus('设置保存失败', 'error');
            }
        }
        
        // 恢复默认设置
        function resetSettings() {
            if (confirm('确定要恢复默认设置吗？')) {
                deleteCookie('appSettings');
                loadSettingsToForm();
                showStatus('已恢复默认设置', 'success');
            }
        }
        
        // 加载设置到表单
        async function loadSettingsToForm() {
            const settings = await loadSettings();
            
            document.getElementById('comment-pages').value = settings.commentPages || 2;
            document.getElementById('max-videos').value = settings.maxVideos || 20;
            document.getElementById('heart-animation').checked = settings.heartAnimation !== false;
            document.getElementById('heart-global').checked = settings.heartGlobal !== false;
            document.getElementById('heart-density').value = settings.heartDensity || 'medium';
            document.getElementById('heart-speed').value = settings.heartSpeed || 'normal';
        }
        

        
        // 显示状态消息
        function showStatus(message, type) {
            const statusMessage = document.getElementById('status-message');
            statusMessage.textContent = message;
            statusMessage.className = type === 'success' ? 'status-success' : 'status-error';

        // 并发请求处理函数
        async function parallelBiliRequest(urls, maxConcurrency, handler) {
            const results = [];
            const executing = []; // 存储当前正在执行的请求
            for (const url of urls) {
                // 执行单个请求处理
                const promise = handler(url)
                    .then(result => {
                        // 请求完成后从执行队列中移除
                        const index = executing.indexOf(promise);
                        if (index !== -1) executing.splice(index, 1);
                        return result;
                    })
                    .catch(error => {
                        const index = executing.indexOf(promise);
                        if (index !== -1) executing.splice(index, 1);
                        console.error(`处理 ${url} 失败:`, error);
                        return {
                            bvid: `错误: ${url}`,
                            title: '-',
                            author: '-',
                            stat: { view: '-', danmaku: '-', reply: '-', favorite: '-', coin: '-', share: '-', like: '-' },
                            comments: { total: 0, pages: 0, comments: [] },
                            error: true
                        };
                    });
                results.push(promise);
                executing.push(promise);
                // 若达到最大并发数，等待任一请求完成再继续
                if (executing.length >= maxConcurrency) {
                    await Promise.race(executing);
                }
            }
            // 等待所有请求完成
            return Promise.all(results);
        }

        // 小红书解析函数
        async function parseXiaohongshuVideo(url) {
            try {
                // 使用后端提供的接口
                const response = await authFetch(`https://api.yutangxiaowu.cn/api/4c/xiaohongshu?content=${encodeURIComponent(url)}`, {
                    method: 'GET'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const res = await response.json();
                
                if (res.code === 0) {
                    const videoData = res.data;
                    videoData.platform = 'xiaohongshu';
                    videoData.url = url; // 确保保留原始URL
                    
                    // 确保 stat 字段存在且数值有效
                    if (!videoData.stat) videoData.stat = {};
                    videoData.stat.view = videoData.stat.view || 0;
                    videoData.stat.like = videoData.stat.like || 0;
                    videoData.stat.comment = videoData.stat.comment || 0;
                    videoData.stat.share = videoData.stat.share || 0;
                    videoData.stat.favorite = videoData.stat.favorite || 0;
                    
                    window.allResults.push(videoData);
                } else {
                    console.error('小红书解析失败:', res.msg);
                    window.allResults.push({
                        vid: 'Error',
                        title: `解析失败: ${url}`,
                        author: '-',
                        stat: { view: '-', like: '-', comment: '-', share: '-', favorite: '-' },
                        platform: 'xiaohongshu',
                        error: true
                    });
                }
            } catch (error) {
                console.error('小红书请求错误:', error);
                window.allResults.push({
                    vid: 'Error',
                    title: `请求错误: ${url}`,
                    author: '-',
                    stat: { view: '-', like: '-', comment: '-', share: '-', favorite: '-' },
                    platform: 'xiaohongshu',
                    error: true
                });
            }
        }

        // 小红书推荐处理
        function handleXiaohongshuRecommend() {
            if (window.allResults && window.allResults.length > 0) {
                const recommender = new VideoXiaohongshuRecommender();
                // 确保只推荐小红书且有效的视频
                const validVideos = window.allResults.filter(v => v.platform === 'xiaohongshu' && !v.error);
                
                if (validVideos.length === 0) {
                    alert('没有足够的小红书有效数据生成推荐');
                    return;
                }
                
                const rankedVideos = recommender.recommend(validVideos);
                const topNValue = document.getElementById('recommend-num-select').value;
                const topN = topNValue === 'all' ? rankedVideos.length : parseInt(topNValue);
                
                
                let report = '';
                if (typeof recommender.generateRecommendationReport === 'function') {
                    report = recommender.generateRecommendationReport(rankedVideos, topN);
                } else {
                    // 如果类中没有实现，提供一个基础实现
                    report = `<div class="recommendation-report" style="margin-top: 20px; padding: 20px; background: #fff1f2; border: 1px solid #ff2442; border-radius: 8px;">
                        <h3 style="color: #ff2442;">小红书笔记推荐</h3>
                        <ul>`;
                    
                    rankedVideos.slice(0, topN).forEach((video, index) => {
                         const title = video.video && video.video.title ? video.video.title : video.title || '-';
                         const author = video.owner && video.owner.name ? video.owner.name : video.author || '-';
                         
                         report += `<li style="margin-bottom: 10px;">
                            <strong>${index + 1}. ${title}</strong> (得分: ${video.totalScore.toFixed(4)})<br>
                            <small>作者: ${author} | 点赞: ${video.stat.like} | 评论: ${video.stat.comment} | 收藏: ${video.stat.favorite}</small>
                         </li>`;
                    });
                    
                    report += `</ul></div>`;
                }
                
                // Remove all existing recommendation reports to prevent accumulation
                const oldReports = document.querySelectorAll('.recommendation-report');
                oldReports.forEach(report => report.remove());
                resultArea.insertAdjacentHTML('afterend', report);
            }
        }

        // 小红书图表渲染
        function renderXiaohongshuChart(chartType = 'bar', limit = '5', dimension = 'all') {
            const validVideos = window.allResults.filter(v => !v.error);
            if (validVideos.length === 0) return;
            
            let displayVideos = [...validVideos];
            if (dimension !== 'all') {
                displayVideos.sort((a, b) => Number(b.stat[dimension] || 0) - Number(a.stat[dimension] || 0));
            } else {
                displayVideos.sort((a, b) => (b.totalScore || 0) - (a.totalScore || 0));
            }
            
            if (limit !== 'all') displayVideos = displayVideos.slice(0, parseInt(limit));
            
            const labels = displayVideos.map(v => v.video.title.length > 10 ? v.video.title.substring(0, 10) + '...' : v.video.title);
            
            const metrics = [
                { key: 'like', name: '点赞数', color: 'rgba(255, 36, 66, 0.7)' },
                { key: 'comment', name: '评论数', color: 'rgba(54, 162, 235, 0.7)' },
                { key: 'share', name: '分享数', color: 'rgba(255, 206, 86, 0.7)' },
                { key: 'favorite', name: '收藏数', color: 'rgba(75, 192, 192, 0.7)' }
            ];
            
            let datasets;
            if (dimension !== 'all') {
                const metric = metrics.find(m => m.key === dimension);
                datasets = [{
                    label: metric.name,
                    data: displayVideos.map(v => Number(v.stat[metric.key] || 0)),
                    backgroundColor: metric.color,
                    borderWidth: 1
                }];
            } else {
                datasets = metrics.map(metric => ({
                    label: metric.name,
                    data: displayVideos.map(v => Number(v.stat[metric.key] || 0)),
                    backgroundColor: metric.color,
                    borderWidth: 1
                }));
            }
            
            const ctx = document.getElementById('video-stats-chart').getContext('2d');
            if (window.videoChart) window.videoChart.destroy();
            
            window.videoChart = new Chart(ctx, {
                type: chartType,
                data: { labels, datasets },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

                const requestUrl = `https://api.yutangxiaowu.cn/api/4c/bili/combinedVideo?url=${encodeURIComponent(bilibiliUrl)}`;
                const response = await authFetch(requestUrl, {
                    method: 'GET',
                    timeout: 10000
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error('网络响应失败');
                }

                const data = await response.json();

                if (data.code === 0) {
                    // 解析成功后获取评论
                    const comments = await getVideoComments(data.data.bvid);

                    return {
                        bvid: data.data.bvid,
                        title: data.data.video.title,
                        pic: data.data.video.fm,
                        author: data.data.owner.name,
                        url: data.data.video.url,
                        stat: data.data.stat,
                        comments: comments, // 添加评论数据

                    renderRecentKuaishouDataTable(window.originalRecentData);

            }
        }


        // 排序最近数据
        function sortRecentData(data) {
            const { field, order } = window.currentSort;
            if (!field) return data;

            return data.sort((a, b) => {
                // 获取比较值
                let valueA, valueB;
                if (field === 'totalScore') {
                    // 查找对应的综合得分
                    const itemA = window.recentResults.find(r => r.bvid === a.bvid || r.vid === a.vid);
                    const itemB = window.recentResults.find(r => r.bvid === b.bvid || r.vid === b.vid);
                    valueA = itemA && itemA.totalScore ? itemA.totalScore : 0;
                    valueB = itemB && itemB.totalScore ? itemB.totalScore : 0;
                } else {
                    valueA = Number(a[field]) || 0;
                    valueB = Number(b[field]) || 0;
                }

                // 执行排序
                return order === 'asc' ? valueA - valueB : valueB - valueA;
            });
        }

        // 渲染最近小红书数据图表
        function renderRecentXiaohongshuChart(chartType = 'bar', limit = '5', dimension = 'all') {
            const validVideos = window.recentResults.filter(v => !v.error);
            if (validVideos.length === 0) return;
            
            let displayVideos = [...validVideos];
            if (dimension !== 'all') {
                displayVideos.sort((a, b) => Number(b.stat[dimension.replace('_count', '')] || 0) - Number(a.stat[dimension.replace('_count', '')] || 0));
            } else {
                displayVideos.sort((a, b) => (b.totalScore || 0) - (a.totalScore || 0));
            }
            
            if (limit !== 'all') displayVideos = displayVideos.slice(0, parseInt(limit));
            
            const labels = displayVideos.map(v => v.title.length > 10 ? v.title.substring(0, 10) + '...' : v.title);
            
            const metrics = [
                { key: 'like', name: '点赞数', color: 'rgba(255, 36, 66, 0.7)' },
                { key: 'comment', name: '评论数', color: 'rgba(54, 162, 235, 0.7)' },
                { key: 'share', name: '分享数', color: 'rgba(255, 206, 86, 0.7)' },
                { key: 'favorite', name: '收藏数', color: 'rgba(75, 192, 192, 0.7)' }
            ];
            
            let datasets;
            if (dimension !== 'all') {
                const metricKey = dimension.replace('_count', '');
                const metric = metrics.find(m => m.key === metricKey);
                datasets = [{
                    label: metric.name,
                    data: displayVideos.map(v => Number(v.stat[metricKey] || 0)),
                    backgroundColor: metric.color,
                    borderWidth: 1
                }];
            } else {
                datasets = metrics.map(metric => ({
                    label: metric.name,
                    data: displayVideos.map(v => Number(v.stat[metric.key] || 0)),
                    backgroundColor: metric.color,
                    borderWidth: 1
                }));
            }
            
            const ctx = document.getElementById('recent-video-stats-chart').getContext('2d');
            if (window.recentVideoChart) window.recentVideoChart.destroy();
            
            window.recentVideoChart = new Chart(ctx, {
                type: chartType,
                data: { labels, datasets },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // 最近数据删除函数

            // 从两个数据源中删除对应视频
            if (isBiliData) {
                window.recentResults = window.recentResults.filter(video => video.bvid !== id);
                // 同时从原始数据中删除（保持与服务器返回格式一致）
                if (window.originalRecentData) {
                    window.originalRecentData = window.originalRecentData.filter(item => item.bvid !== id);
                }

                // 更新表格显示 - 使用过滤后的原始数据
                renderRecentBiliDataTable(window.originalRecentData);
            } else if (isKuaishouData) {
                // 快手使用url作为ID
                window.recentResults = window.recentResults.filter(video => video.url !== id);
                // 同时从原始数据中删除
                if (window.originalRecentData) {
                    window.originalRecentData = window.originalRecentData.filter(item => item.url !== id);
                }

                // 更新表格显示
                renderRecentKuaishouDataTable(window.originalRecentData);
            } else if (isXiaohongshuData) {
                // 小红书使用vid作为ID
                window.recentResults = window.recentResults.filter(video => video.vid !== id);
                // 同时从原始数据中删除
                if (window.originalRecentData) {
                    window.originalRecentData = window.originalRecentData.filter(item => item.vid !== id);
                }

                // 更新表格显示
                renderRecentXiaohongshuDataTable(window.originalRecentData);
            } else {
                // 默认为抖音
                window.recentResults = window.recentResults.filter(video => video.vid !== id);

                if (window.originalRecentData) {

                renderRecentDouyinDataTable(window.originalRecentData);

            // 更新图表

            const limit = document.getElementById('recent-chart-limit').value;

            // 根据数据类型判断平台
            if (window.recentResults && window.recentResults.length > 0) {
                if (isBiliData) {
                    renderRecentBiliChart(chartType, limit, dimension);
                } else if (isKuaishouData) {
                    renderRecentKuaishouChart(chartType, limit, dimension);
                } else if (isXiaohongshuData) {
                    renderRecentXiaohongshuChart(chartType, limit, dimension);
                } else {
                    // 默认认为是抖音数据
                    renderRecentDouyinChart(chartType, limit, dimension);
                }
            } else {

                if (window.recentVideoChart) {

        // 日期格式化函数
        function formatDate(dateString) {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 处理排序变更
        function handleSortChange() {
            const sortField = document.getElementById('sort-field').value;
            const sortOrder = document.getElementById('sort-order').value;

            window.currentSort = { field: sortField, order: sortOrder };
            updateResultBiliTable();
        }

        // 排序数据
        function sortData(data) {
            const { field, order } = window.currentSort;
            if (!field) return data;

            return data.sort((a, b) => {
                // 错误数据排在最后
                if (a.error) return 1;
                if (b.error) return -1;

                // 获取比较值
                let valueA, valueB;
                if (field === 'totalScore') {
                    valueA = a.totalScore || 0;
                    valueB = b.totalScore || 0;
                } else {
                    valueA = Number(a.stat[field]) || 0;
                    valueB = Number(b.stat[field]) || 0;
                }

                // 执行排序
                return order === 'asc' ? valueA - valueB : valueB - valueA;
            });
        }

        // 数字格式化（添加千位分隔符）
        function formatNumber(num) {
            if (num === '-' || num === undefined) return '-';
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // 图表导出功能函数
        function exportChart(chartInstance, format, fileName) {
            if (!chartInstance) {
                alert('没有可导出的图表');
                return;
            }

            try {
                // 显示导出状态
                const statusElement = document.createElement('div');
                statusElement.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(0, 0, 0, 0.8);
                    color: white;
                    padding: 1rem 2rem;
                    border-radius: 8px;
                    z-index: 10000;
                    font-size: 16px;
                `;
                statusElement.textContent = '正在导出图表...';
                document.body.appendChild(statusElement);

                // 使用Chart.js内置的toBase64Image方法导出图表
                const mimeType = format === 'png' ? 'image/png' : 'image/jpeg';
                const quality = format === 'jpeg' ? 0.9 : 1.0;

                // 配置导出选项
                const exportOptions = {
                    format: format,
                    quality: quality,
                    backgroundColor: 'white'
                };

                // 获取图表的base64编码
                const chartUrl = chartInstance.toBase64Image(exportOptions);

                // 创建下载链接
                const link = document.createElement('a');
                link.href = chartUrl;
                link.download = `${fileName}_${new Date().toLocaleDateString().replace(/\//g, '-')}.${format}`;

                // 模拟点击下载
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // 移除状态提示
                setTimeout(() => {
                    document.body.removeChild(statusElement);
                }, 1000);

            } catch (error) {
                console.error('图表导出失败:', error);
                alert('图表导出失败，请检查控制台获取详细信息');
                // 移除状态提示
                const statusElement = document.querySelector('div[style*="position: fixed"]');
                if (statusElement) {
                    document.body.removeChild(statusElement);
                }
            }
        }



        // 登录/退出按钮事件
        document.getElementById('login-button').addEventListener('click', login);
        document.getElementById('logout-button').addEventListener('click', logout);

        // 页面加载时检查登录状态
        window.addEventListener('load', checkAuth);

        // 模拟数据与文件导入功能
        document.addEventListener('DOMContentLoaded', () => {
            const mockGenerator = new MockDataGenerator();

            // 模拟数据按钮
            const btnMock = document.getElementById('btn-mock');
            if (btnMock) {
                btnMock.addEventListener('click', () => {
                    if (confirm('是否生成演示用的模拟数据？这将覆盖当前列表。')) {
                        const mockData = mockGenerator.generateMockData(15); // 生成15条数据

                        // 更新全局数据
                        window.allResults = mockData;
                        if (window.mixedParser) {
                            window.mixedParser.allResults = mockData;
                            window.mixedParser.updateMixedResultTable(resultArea);
                        }

                        alert('已生成 15 条模拟数据用于演示');
                    }
                });
            }

            // 文件导入按钮
            const btnImport = document.getElementById('btn-import');
            const fileInput = document.getElementById('file-input');

            if (btnImport && fileInput) {
                btnImport.addEventListener('click', () => {
                    fileInput.click();
                });

                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();

                    reader.onload = (event) => {
                        try {
                            const data = event.target.result;
                            let parsedData = [];

                            if (file.name.endsWith('.json')) {
                                parsedData = JSON.parse(data);
                                processImportedData(parsedData);
                            } else if (file.name.endsWith('.xlsx')) {
                                const workbook = XLSX.read(data, { type: 'binary' });
                                const firstSheetName = workbook.SheetNames[0];
                                const worksheet = workbook.Sheets[firstSheetName];
                                parsedData = XLSX.utils.sheet_to_json(worksheet);
                                processImportedData(parsedData);
                            } else {
                                alert('不支持的文件格式，请上传 .xlsx 或 .json 文件');
                            }
                        } catch (error) {
                            console.error('文件读取失败:', error);
                            alert('文件解析失败，请检查文件格式');
                        }
                        // 清空input，允许重复上传同一文件
                        fileInput.value = '';
                    };

                    if (file.name.endsWith('.json')) {
                        reader.readAsText(file);
                    } else {
                        reader.readAsBinaryString(file);
                    }
                });
            }

            function processImportedData(rawData) {
                const { validData, errors } = mockGenerator.cleanImportData(rawData);

                if (validData.length > 0) {
                    window.allResults = validData;
                    if (window.mixedParser) {
                        window.mixedParser.allResults = validData;
                        window.mixedParser.updateMixedResultTable(resultArea);
                    }

                    let msg = `成功导入 ${validData.length} 条数据。`;
                    if (errors.length > 0) {
                        msg += `\n注意：有 ${errors.length} 条数据因格式问题被跳过。`;
                    }
                    alert(msg);
                } else {
                    alert('未找到有效数据，请检查文件格式。\n错误示例：' + (errors[0] || '未知错误'));
                }
            }
        });
    </script>
